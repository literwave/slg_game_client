syntax = "proto3";

package Activity;

// 活动状态：0未开启 1进行中 2已结束
// 进度/已领阶段等由配置与业务侧自行推导，协议不带
message p_activity_info {
	int32 activityId = 1;
	int32 state = 2;
	int32 startTime = 3;
	int32 endTime = 4;
}

// 请求活动列表
message c2s_req_activity_list {
}

message s2c_req_activity_list {
	repeated p_activity_info activityList = 1;
}

// 同步单个活动
message s2c_sync_activity {
	p_activity_info activityInfo = 1;
}

// 领取活动奖励（登录/在线/冲榜/礼包等）；兑换也走此协议，index=兑换项，无分段传 0
message c2s_get_activity_reward {
	int32 activityId = 1;
	int32 index = 2; // 天/阶段/名次段/兑换项等，无分段时传 0
	int32 count = 3; // 兑换数量，领奖类传 0 或 1
}

message s2c_get_activity_reward {
	int32 activityId = 1;
	int32 index = 2;
	int32 count = 3;
}
