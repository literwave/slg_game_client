syntax = "proto3";

package Common;

message p_reward_info {
	int32 rewardType = 1;
	int32 itemId = 2;
	int32 itemCount = 3;
}

// 通用坐标（主城、地图点等）
message p_pos {
	int32 x = 1;
	int32 y = 2;
}

// 浮点坐标（行军插值路径等）
message p_pos_f {
	float x = 1;
	float y = 2;
}

// 兵力（无兵种）
message p_soldier_info {
	uint32 count = 1;      // 可用兵力
	uint32 hurtCount = 2;  // 伤兵
}

message p_common_info {
	int32 k = 1;
	int32 v = 2;
}

message p_common_info_int_str {
	int32 k = 1;
	string v = 2;
}

message p_hero_base_info {
	int32 heroType = 1;
	int32 exp = 2;
	int32 lv = 3;
	int32 star = 4;
	bool newTag = 5;
	repeated p_common_info skillList = 6; 
}

// mailId → Mail.Id（邮件模板）；mailUid 为邮件唯一实例 id
message p_mail_info {
	int32 mailId = 1;
	int64 mailUid = 2;
	string title = 3;
	string content = 4;
	bool isRead = 5;
	bool isLock = 6;
	bool isGotReward = 7;
	int32 startTime = 8;
	int32 endTime = 9;
}
