syntax = "proto3";

package User;

import "common.proto";

message c2s_user_base_info {
}

message s2c_user_base_info {
	string name = 1;
    int32 headIcon = 2;
    int32 sex = 3;
    int32 birthTime = 4;
    int32 level = 5;
    int32 exp = 6;
	Common.p_soldier_info soldierInfo = 7;  // 城中兵力
	Common.p_pos cityPos = 8;               // 主城坐标
	int64 allianceId = 9;                   // 联盟 id，0=无联盟
}

// 同步城中兵力
message s2c_sync_soldier {
	Common.p_soldier_info soldierInfo = 1;
}

// 迁主城（消耗道具 Item.Id=1001 迁城令；成功后也可推 s2c_sync_city_pos）
message c2s_move_city {
	Common.p_pos pos = 1;                  // 目标坐标
}
message s2c_move_city {
	Common.p_pos cityPos = 1;              // 迁城后主城坐标
}

// 同步主城坐标（迁城等）
message s2c_sync_city_pos {
	Common.p_pos cityPos = 1;
}

message c2s_user_create {
    string name = 1;
    int32 sex = 2;
}

message s2c_user_create {
    string name = 1;
    int32 sex = 2;
}

message c2s_req_user_res {
}

message s2c_req_user_res {
    repeated Common.p_common_info resList = 1;
}

message s2c_sync_user_res_list {
    repeated Common.p_common_info resList = 1;
}

message s2c_sys_notify_by_lanid {
    repeated string tbl = 1;
}

message s2c_tell_me {
    string msg = 1;
}

message c2s_gm_command {
    string cmd = 1;
}
message s2c_gm_command_help {
    repeated Common.p_common_info ret = 1;
}

message c2s_change_head_icon {
    int32 headIcon = 1;
}
message s2c_change_head_icon {
    int32 headIcon = 1;
}

message c2s_client_load_ok {
}
message s2c_client_load_ok {
}